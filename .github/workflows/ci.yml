name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_HOST: 192.168.1.65
  K3S_HOST: 192.168.1.66
  K3S_USER: k3s_master

jobs:
  build-backend:
    runs-on: runner-nhl
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: http://${{ env.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      
      - name: Build and push backend
        run: |
          docker build -t ${{ env.HARBOR_HOST }}/nhl_scanner/backend:${{ github.sha }} -t ${{ env.HARBOR_HOST }}/nhl_scanner/backend:latest -f ./backend/Dockerfile ./backend
          docker push ${{ env.HARBOR_HOST }}/nhl_scanner/backend:${{ github.sha }}
          docker push ${{ env.HARBOR_HOST }}/nhl_scanner/backend:latest

  build-frontend:
    runs-on: runner-nhl
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: http://${{ env.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      
      - name: Build and push frontend
        run: |
          docker build -t ${{ env.HARBOR_HOST }}/nhl_scanner/frontend:${{ github.sha }} -t ${{ env.HARBOR_HOST }}/nhl_scanner/frontend:latest -f ./frontend/Dockerfile ./frontend
          docker push ${{ env.HARBOR_HOST }}/nhl_scanner/frontend:${{ github.sha }}
          docker push ${{ env.HARBOR_HOST }}/nhl_scanner/frontend:latest

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: runner-nhl
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to k3s
        run: |
          scp -o StrictHostKeyChecking=no -r helm k3s_master@192.168.1.66:/tmp/
          ssh -o StrictHostKeyChecking=no k3s_master@192.168.1.66 << 'EOF'
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          helm upgrade --install nhl-scanner /tmp/helm/hockey-analytics \
            --namespace nhl-scanner \
            --create-namespace
          EOF
