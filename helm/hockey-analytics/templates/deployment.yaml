apiVersion: apps/v1
kind: Deployment
metadata:
  name: hockey-analytics-backend
  labels:
    app: hockey-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hockey-analytics
  template:
    metadata:
      labels:
        app: hockey-analytics
    spec:
      containers:
      - name: backend
        image: "192.168.1.65/hockey-analytics/backend:latest"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: hockey-analytics-svc
spec:
  type: NodePort
  selector:
    app: hockey-analytics
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
