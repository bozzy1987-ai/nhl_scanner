apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhl-scanner-backend
  labels:
    app: nhl-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nhl-scanner
  template:
    metadata:
      labels:
        app: nhl-scanner
    spec:
      containers:
      - name: backend
        image: "192.168.1.65/nhl_scanner/backend:latest"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: nhl-scanner-backend-svc
spec:
  type: NodePort
  selector:
    app: nhl-scanner
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhl-scanner-frontend
  labels:
    app: nhl-scanner-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nhl-scanner-frontend
  template:
    metadata:
      labels:
        app: nhl-scanner-frontend
    spec:
      containers:
      - name: frontend
        image: "192.168.1.65/nhl_scanner/frontend:latest"
        imagePullPolicy: IfNotPresent
        env:
        - name: REACT_APP_API_URL
          value: "http://192.168.1.66:30081"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nhl-scanner-frontend-svc
spec:
  type: NodePort
  selector:
    app: nhl-scanner-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
