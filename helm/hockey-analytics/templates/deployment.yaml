apiVersion: apps/v1
kind: Deployment
metadata:
  name: hockey-analytics-backend
  labels:
    app: hockey-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hockey-analytics
  template:
    metadata:
      labels:
        app: hockey-analytics
    spec:
      containers:
      - name: backend
        image: "192.168.1.65/nhl_scanner/backend:latest"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: hockey-analytics-backend-svc
spec:
  type: NodePort
  selector:
    app: hockey-analytics
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hockey-analytics-frontend
  labels:
    app: hockey-analytics-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hockey-analytics-frontend
  template:
    metadata:
      labels:
        app: hockey-analytics-frontend
    spec:
      containers:
      - name: frontend
        image: "192.168.1.65/nhl_scanner/frontend:latest"
        imagePullPolicy: IfNotPresent
        env:
        - name: REACT_APP_API_URL
          value: "http://192.168.1.66:30081"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hockey-analytics-frontend-svc
spec:
  type: NodePort
  selector:
    app: hockey-analytics-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
